  maxOpenConns: 40
  maxIdleConns: 10
  connMaxLifeSec: 3600

postgres:
  dsn: "postgres://aisaas:aisaas@127.0.0.1:15432/ykt_aisaas_rag"
  maxConns: 8

redis:
  addr: "127.0.0.1:16379"
  password: ""
  db: 0

crypto:
  aesKey: "dev-aes-key-32-bytes-1234567890a"

tenant:
