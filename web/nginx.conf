# ykt-aisaas-portal 前端
#
# 转发规则对应 vite.config.js 的 dev proxy，全部指向 ykt-aisaas:8190。
# 用正则 location 一次性覆盖所有 API 前缀，避免逐条重复。

upstream aisaas_backend {
    server ykt-aisaas:8190;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API：/portal/ /v1/ /internal/ 以及 /api/ 下的各业务前缀
    location ~ ^/(portal|v1|internal)/ {
        proxy_pass http://aisaas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(v1|usage|billing|personas|memories|sessions|mcp|knowledge-bases|anomaly) {
        proxy_pass http://aisaas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退（放在最后，正则 location 优先级更高）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
