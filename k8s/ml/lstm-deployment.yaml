apiVersion: v1
kind: Service
metadata:
  name: lstm-inference
  namespace: production
  labels:
    app: lstm-inference
spec:
  type: ClusterIP
  ports:
    - port: 8201
      targetPort: 8201
      protocol: TCP
  selector:
    app: lstm-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lstm-inference
  namespace: production
  labels:
    app: lstm-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lstm-inference
  template:
    metadata:
      labels:
        app: lstm-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8201"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: lstm
          image: lstm-anomaly-detector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8201
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: 1  # GPU optional, CPU also works
            limits:
              cpu: 2000m
              memory: 8Gi
              nvidia.com/gpu: 1
          env:
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: STREAM_NAME
              value: "aisaas:metering:stream"
            - name: MODEL_DIR
              value: "/app/models/anomaly"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: PORT
              value: "8201"
          volumeMounts:
            - name: models
              mountPath: /app/models
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8201
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8201
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: lstm-models-pvc
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lstm-models-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lstm-inference-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lstm-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: lstm_inference_requests_total
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
