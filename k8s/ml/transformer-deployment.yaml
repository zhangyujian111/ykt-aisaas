apiVersion: v1
kind: Service
metadata:
  name: transformer-inference
  namespace: production
  labels:
    app: transformer-inference
spec:
  type: ClusterIP
  ports:
    - port: 8202
      targetPort: 8202
      protocol: TCP
  selector:
    app: transformer-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformer-inference
  namespace: production
  labels:
    app: transformer-inference
    version: V9-T
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transformer-inference
  template:
    metadata:
      labels:
        app: transformer-inference
        version: V9-T
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8202"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: transformer
          image: transformer-anomaly:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8202
              name: http
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1  # GPU required for Transformer
            limits:
              cpu: 8000m
              memory: 16Gi
              nvidia.com/gpu: 1
          env:
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: STREAM_NAME
              value: "aisaas:metering:stream"
            - name: MODEL_DIR
              value: "/app/models/anomaly"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: PORT
              value: "8202"
          volumeMounts:
            - name: models
              mountPath: /app/models
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8202
            initialDelaySeconds: 60  # Transformer 需要更长的启动时间（加载模型）
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8202
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: transformer-models-pvc
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transformer-models-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi  # Transformer 模型更大，需要更多存储空间
  storageClassName: standard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transformer-inference-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transformer-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: transformer_inference_requests_total
        target:
          type: AverageValue
          averageValue: "20"  # Transformer 推理更慢，吞吐量更低
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
